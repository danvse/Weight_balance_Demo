name: Deploy Angular Demo to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'august-care-angular/package-lock.json'

      - name: Install dependencies
        working-directory: august-care-angular
        run: npm ci

      - name: Build Angular production bundle
        working-directory: august-care-angular
        run: npx ng build --configuration production --base-href /Weight_balance_Demo/

      - name: Add SPA fallback and .nojekyll
        run: |
          cp august-care-angular/dist/august-care-angular/browser/index.html august-care-angular/dist/august-care-angular/browser/404.html
          touch august-care-angular/dist/august-care-angular/browser/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: august-care-angular/dist/august-care-angular/browser

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
